# 3. Initial Inventory - Vineyard/Reception
#
# 'ST0': Initial Stock at Time = 0
[initial_inventory]
    s_red = 655000
    s_white_rose = 1414137

# 3b. Raw Material Cost (USD/L)
#
# Cost of grapes consumed from shared raw pools.
[raw_material_cost]
    s_red = 2.20
    s_white_rose = 1.80

# 4. Upper Bounds for the Model
#
# It is used as:
# ProdFinal[s] =< ProdFinal_bounds[s]
# This is equivalent to adding an explicit constraint,
# but implemented as a variable bound, which is tighter and better for MIP performance.
[product_ub]
    Red1 = 5000
    Red2 = 6000
    Red3 = 5500
    Red4 = 4000
    Red5 = 3500
    Rose1 = 8000
    Rose2 = 5000
    White1 = 8000
    White2 = 5000
    White3 = 6000

# 5. Product Lines
#
# Each [lines.N] entry defines one production line.
#
# steps: ordered list of processing tasks for this line
#        Pr = pressing
#        Fa = alcoholic fermentation
#        Fl = malolactic fermentation
#        Cs = cold stabilization
#        AgeBarXM = barrel aging X months
#        AgeJarXM = jar aging X months
#        Alm = long-term storage
# ecobulk: (optional, default false)
#          true -> product is stored in ecobulk-type tanks (subject to A16/A17)
#          false -> no ecobulk constraint
[lines.1]
product = "Red1"
steps = ["Fa", "Fl", "AgeBar4M", "Cs"]

[lines.2]
product = "Red2"
steps = ["Fa", "Fl", "AgeBar9M", "Cs"]

[lines.3]
product = "Red3"
steps = ["Fa", "Fl", "AgeBar11M", "Cs"]

[lines.4]
product = "Red4"
steps = ["Fa", "Fl", "AgeBar15M", "Cs"]

[lines.5]
product = "Red5"
steps = ["Fa", "Fl", "AgeJar4M", "Cs"]

[lines.6]
product = "Rose1"
steps = ["Pr", "Fa", "Cs"]

[lines.7]
product = "Rose2"
steps = ["Pr", "Fa", "AgeJar1M", "Cs"]

[lines.8]
product = "White1"
steps = ["Pr", "Fa", "Cs"]

[lines.9]
product = "White2"
steps = ["Pr", "Fa", "AgeJar1M", "Cs"]

[lines.10]
product = "White3"
steps = ["Pr", "Fa", "Fl", "AgeBar2M", "Cs"]

# 6. Tasks Templates
#
# These rules apply to ALL lines
#
# Pressing (Pr)
[templates.Pr]
    alpha = 1.0
    beta = 0.004 # 1 h/250 L
    compatible_units = ["press"]

# Fermentation (Fa)
[templates.Fa]
    alpha = 240.0
    beta = 0.0
    compatible_units = ["inox5000", "inox10000", "inox17500", "inox22000"]

# Malolactic fermentation (Fl)
[templates.Fl]
    alpha = 720.0
    beta = 0.0
    compatible_units = ["inox22000", "subte6300", "subte7500", "subte9000", "subte9500", "subte12700"]

# Cold stabilization (Cs)
[templates.Cs]
    alpha = 168.0
    beta = 0.0
    compatible_units = ["iso5000", "iso10000"]

# Aging in barriques (2 months)
[templates.AgeBar2M]
    alpha = 1440.0
    beta = 0.0
    compatible_units = ["barrique"]
    max_units = 85

# Aging in barriques (4 months)
[templates.AgeBar4M]
    alpha = 2880.0
    beta = 0.0
    compatible_units = ["barrique"]
    max_units = 85

# Aging in barriques (9 months)
