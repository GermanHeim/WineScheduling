# Winery Scheduling Optimization Model Parameters
#
# 1. Global Settings - Time and Penalties
[global]
    # The "Big M" Horizon (total available hours in the model)
    H = 4320  # 180 days

    # Target Deadline for the schedule
    # (Used to calculate lateness penalty in profit maximization)
    deadline = 3600 # 150 days

    # Penalty for being late ($/hour delayed past deadline)
    penaltyLate = 100

    # Technical penalty weights for profit optimization (all in USD)
    # These are scaled to be meaningful compared to revenue 
    # (aprox $300k) and lateness (aprox $10k-50k)
    penaltyEmptyTank = 5000.0     # Penalty ($) for each unused storage tank (opportunity cost, overhead)
    penaltyAir = 1000.0           # Penalty ($) for free space in tanks (inefficiency, normalized by avg range)

# 2. Products - Prices, Demand, Outsourcing Costs
#
# 'name': Product Name
# 'demand': Demand (L)
# 'price': Selling price ($/L)
# 'costOutsourcing': Cost to buy from external winery ($/L)
[products]
    [products.p1]
        name = "p1"
        demand = 1134
        price = 12.50
        costOutsourcing = 15.00

    [products.p2]
        name = "p2"
        demand = 3465
        price = 8.00
        costOutsourcing = 8.50
    
    [products.p3]
        name = "p3"
        demand = 3780
        price = 9.50
        costOutsourcing = 11.00

    [products.p4]
        name = "p4"
        demand = 4000
        price = 13.00
        costOutsourcing = 16.00

    [products.p5]
        name = "p5"
        demand = 10000
        price = 10.00
        costOutsourcing = 12.00
    
    [products.p6]
        name = "p6"
        demand = 10000
        price = 9.00
        costOutsourcing = 11.50

# 3. Initial Inventory - Vineyard/Reception
#
# 'ST0': Initial Stock at Time = 0
[initial_inventory]
    s1 = 100000
    s2 = 9137
    s3 = 400000
    s4 = 400000
    s5 = 600000
    s6 = 150000

# 4. Upper Bounds for the Model
#
# Maybe we need to change this since we change the timespan of the model
# and we are using profit instead of makespan
#
# It was used as:
# ProdFinal[s] =< ProdFinal_bounds[s]
# This is equivalent to adding an explicit constraint,
# but implemented as a variable bound, which is tighter and better for MIP performance.
[product_ub]
    p1 = 1134
    p2 = 3465
    p3 = 3780
    p4 = 4000
    p5 = 10000
    p6 = 10000

# 5. Product Lines
# 
# This list tells Python to generate tasks for lines 1 to 6
# Since there are 6 production lines (6 Fa, 6 Fl, 6 Fr, 6 Alm)
[lines]
idx = ["1", "2", "3", "4", "5", "6"]

# 6. Tasks Templates
# 
# These rules apply to ALL lines
#
# Fermentation (Fa)
[templates.Fa]
    alpha = 144.0  # Duration
    beta = 0.0
    # Consumes S1, S2...
    input_suffix = "S" 
    # Produces V1, V2... 
    output_suffix = "V" 
    yield = 0.7
    
    # Allowed Tanks and Limits [Bmin, Bmax]
    [templates.Fa.compatible_units]
        inox5000  = [500, 4000]
        inox10000 = [1000, 8000]
        inox17500 = [1750, 14000]
        inox22000 = [2200, 17600]

# Malolactic fermentation (Fl)
[templates.Fl]
    alpha = 504.0
    beta = 0.0
    input_suffix = "V"
    output_suffix = "Vl"
    yield = 0.9
    
    # Allowed Tanks and Limits [Bmin, Bmax]
    [templates.Fl.compatible_units]
        inox22000  = [4400, 21560] 
        subte6300  = [1260, 6174]
        subte7500  = [1500, 7350]
        subte9000  = [1800, 8820]
        subte9500  = [1900, 9310]
        subte12700 = [2540, 12446]

# Cold stabilization (Fr)
[templates.Fr]
    alpha = 168.0
    beta = 0.0
    input_suffix = "Vl"
    output_suffix = "p"
    yield = 1.0
    
    # Allowed Tanks and Limits [Bmin, Bmax]
    [templates.Fr.compatible_units]
        iso5000  = [1000, 5000]
        iso10000 = [2000, 10000]

# Storage (Alm)
[templates.Alm]
    beta = 0.0
    input_suffix = "p"
    output_suffix = "p"
    # Storage: Input = Output
    yield = 1.0
    
    # Allowed Tanks and Limits [Bmin, Bmax]
    [templates.Alm.compatible_units]
        inox22000  = [20900, 22000]
        subte6300  = [5985, 6300]
        subte7500  = [7125, 7500]
        subte9000  = [8550, 9000]
        subte9500  = [9025, 9500]
        subte12700 = [12065, 12700]
        iso5000    = [4750, 5000]
        iso10000   = [9500, 10000]

# 7. State Consumption/Production Coefficients (rho)
# 
# These define how much of each state is consumed/produced per unit batch size
# for each task type. Applied to all lines (1-6) of each task type.
