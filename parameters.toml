# 8. Units
#
# Centralized unit definitions.
# - quantity:  number of physically available units of that type
# - exterior:  true -> incurs cooling cost (costCooling per Lh)
# - ecobulk:   true -> Alm limited to 720 h (1 month) by model constraint A_eco_alm_max
# - task_bounds.<Task>: [Bmin, Bmax] for range, or scalar B for fixed-capacity (Bmin = Bmax = B)
[units.press]
    quantity = 1
    task_bounds = {Pr = [5000, 38000]}

[units.iso_ext_5000]
    quantity = 1
    exterior = true
    task_bounds = {Cs = 5000}

[units.iso_ext_10000]
    quantity = 1
    exterior = true
    task_bounds = {Cs = [5000, 10000]}

[units.inox_ext_10000]
    quantity = 2
    exterior = true
    task_bounds = {Fa = 10000}

[units.inox_ext_22000]
    quantity = 1
    exterior = true
    task_bounds = {Fa = 22000}

[units.inox_ext_5000v]
    quantity = 2
    exterior = true
    task_bounds = {Fa = [1000, 5000]}

[units.inox_int_17000]
    quantity = 1
    task_bounds = {Fa = 17000, Fl = 17000, Cs = 17000, Alm = 17000}

[units.subte_6200]
    quantity = 1
    task_bounds = {Fl = 6200, Alm = 6200}

[units.subte_10500]
    quantity = 1
    task_bounds = {Fl = 10500, Alm = 10500}

[units.subte_9500]
