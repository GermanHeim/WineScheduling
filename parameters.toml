# 3. Initial Inventory - Vineyard/Reception
#
# 'ST0': Initial Stock at Time = 0
[initial_inventory]
    s_red = 65000
    s_white_rose = 180000

# 3b. Raw Material Cost (USD/L)
#
# Cost of grapes consumed from shared raw pools.
[raw_material_cost]
    s_red = 2.20
    s_white_rose = 1.80

# 4. Upper Bounds for the Model
#
# It is used as:
# ProdFinal[s] =< ProdFinal_bounds[s]
# This is equivalent to adding an explicit constraint,
# but implemented as a variable bound, which is tighter and better for MIP performance.
[product_ub]
    Red1 = 8000
    Red2 = 8000
    Red3 = 7500
    Red4 = 9000
    Red5 = 7000
    Rose1 = 10000 # per campaign
    Rose2 = 7000
    White1 = 10000 # per campaign
    White2 = 7000
    White3 = 12000

# 5. Product Lines
#
# Each [lines.N] entry defines one production line.
#
# steps: ordered list of processing tasks for this line
#        Pr = pressing
#        Fa = alcoholic fermentation
#        Fl = malolactic fermentation
#        Cs = cold stabilization
#        AgeBarXM = barrel aging X months
#        AgeJarXM = jar aging X months
#        Alm = long-term storage
# ecobulk: (optional, default false)
#          true -> product is stored in ecobulk-type tanks (subject to A16/A17)
#          false -> no ecobulk constraint
[lines.1]
product = "Red1"
steps = ["Fa", "Fl", "Alm", "AgeBar4M", "Cs"]

[lines.2]
product = "Red2"
steps = ["Fa", "Fl", "Alm", "AgeBar9M", "Cs"]

[lines.3]
product = "Red3"
steps = ["Fa", "Fl", "Alm", "AgeBar11M", "Cs"]

[lines.4]
product = "Red4"
steps = ["Fa", "Fl", "Alm", "AgeBar15M", "Cs"]

[lines.5]
product = "Red5"
steps = ["Fa", "Fl", "Alm", "AgeJar4M", "Cs"]

[lines.6]
product = "Rose1"
steps = ["Pr", "Fa", "Cs"]

[lines.7]
product = "Rose2"
steps = ["Pr", "Fa", "Alm", "AgeJar1M", "Cs"]

[lines.8]
product = "White1"
steps = ["Pr", "Fa", "Cs"]

[lines.9]
product = "White2"
steps = ["Pr", "Fa", "Alm", "AgeJar1M", "Cs"]

[lines.10]
product = "White3"
steps = ["Pr", "Fa", "Fl", "Alm", "AgeBar2M", "Cs"]

# 6. Tasks Templates
#
# These rules apply to ALL lines
#
# Pressing (Pr)
[templates.Pr]
    alpha = 1.0
    beta = 0.004 # 1 h/250 L
    compatible_units = ["press"]

# Fermentation (Fa)
[templates.Fa]
    alpha = 240.0
    beta = 0.0
    compatible_units = [
        "inox_ext_10000", "inox_ext_22000", "inox_ext_5000v",
        "inox_int_17000"
    ]

# Malolactic fermentation (Fl)
[templates.Fl]
    alpha = 720.0
    beta = 0.0
    compatible_units = [
        "subte_6200", "subte_10500", "subte_9500", "subte_15000", "subte_9000",
        "inox_int_17000"
    ]

# Cold stabilization (Cs)
[templates.Cs]
    alpha = 168.0
    beta = 0.0
    compatible_units = [
        "iso_ext_5000", "iso_ext_10000",
        "inox_int_17000"
    ]

[templates.Alm]
    alpha = 48.0
    beta = 0.0
    compatible_units = [
        "inox_int_17000",
        "subte_6200", "subte_10500", "subte_9500", "subte_15000", "subte_9000",
        "ecobulk_1100", "ecobulk_650"
    ]

# Aging in barriques (2 months)
[templates.AgeBar2M]
    alpha = 1440.0
    beta = 0.0
    compatible_units = ["barrique"]
    max_units = 85

# Aging in barriques (4 months)
[templates.AgeBar4M]
