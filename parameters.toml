# Winery Scheduling Optimization Model Parameters
#
# This TOML file is adapted for the Economic maximization Model
#
# 1. Global Settings - Time and Penalties
[global]
    # The Horizon (total available hours in the model)
    H = 16000  # hours

    # Number of event points
    n_max = 10

    # Campaign deadlines (hours). One entry per young-wine campaign (iMaxYoungWine).
    # The k-th element is the deadline for the k-th campaign.
    deadlines = [1260, 8600, 12920]  # D1=52.5 d, D2=358 d, D3=538 d
    penaltyLate = 5 # Penalty for being late ($/hour delayed past deadline)

    # Technical penalty weights for profit optimization (all in USD)
    penaltyMS = 0.05              # Penalty per hour of makespan
    costCooling = 5e-3            # Cooling cost for exterior tanks ($/(L h) of occupancy)
    grape_skin_value = 0.008      # Value assigned to grape skins ($/liter of grape skins produced)
    penaltyDiscard = 5.0          # Cost per liter discarded (approx. raw material + basic processing cost)
    almHoldingCost = 1e-3         # Cost per liter of wine stored

    # Activation/unit assignment limits
    iMax = 1
    # Max activations for young wine tasks.
    # Set to 2 to model two production cycles of young wines from the same line within a single schedule.
    iMaxYoungWine = 3
    jMax = 1
    jMin = 1
    iMaxST = 1
    jMaxST = 1
    jMinST = 1

# 2. Products - Prices, Demand, Outsourcing Costs
#
# 'name': Product Name
# 'category': Wine style (Red, White, Rose)
# 'demand': Demand (L)
# 'price': Selling price per liter ($/L)
# 'costOutsourcing': Cost to outsource production per liter ($/L)
# 'outsourced': Whether the product can be outsourced (true/false)
[products]
