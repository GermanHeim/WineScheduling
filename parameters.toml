# Winery Scheduling Optimization Model Parameters
#
# This TOML file is adapted for the Economic maximization Model
#
# 1. Global Settings - Time and Penalties
[global]
    # The Horizon (total available hours in the model)
    H = 15000  # hours

    # Number of event points
    n_max = 6

    # Target Deadline for the schedule and lateness penalty
    deadline = 1560  # 65 days
    penaltyLate = 250 # Penalty for being late ($/hour delayed past deadline)

    # =1 if the model forces wines using ecobulk to use some kind of tank for final storage
    # =0 if it is optimized
    MustUseEcobulk = 0

    # Technical penalty weights for profit optimization (all in USD)
    penaltyMaxUtilization = 100.0 # Penalty for not utilizing tanks fully
    penaltyEmptyTank = 5000.0     # Penalty for leaving tanks empty
    penaltyAir = 1000.0           # Penalty for leaving air in tanks
    penaltyMS = 1.0               # Penalty per hour of makespan
    costCooling = 1e-2            # Cooling cost for exterior tanks ($/(L h) of occupancy)

    # Activation/unit assignment limits
    iMax = 1
    jMax = 1
    jMin = 1
    iMaxST = 1
    jMaxST = 2
    jMinST = 1

# 2. Products - Prices, Demand, Outsourcing Costs
#
