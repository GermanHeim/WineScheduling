# Winery Scheduling Optimization Model Parameters
#
# This TOML file is adapted for the Makespan Minimization Model
#
# 1. Global Settings - Time and Penalties
[global]
    # The "Big M" Horizon (total available hours in the model)
    H = 3600  # 150 days

    # Number of event points
    n_max = 14

    # Activation/unit assignment limits
    iMax = 1
    jMax = 1
    jMin = 1
    iMaxST = 1
    jMaxST = 2
    jMinST = 1

    # =1 if the model forces wines using ecobulk to use some kind of tank for final storage
    # =0 if it is optimized
    MustUseEcobulk = 0

    # Technical penalty weights (for objective function tuning) based on time (h)
    penaltyMaxUtilization = 0.25  # Penalty for not utilizing tanks fully
    penaltyEmptyTank = 10.0       # Penalty for leaving tanks empty
    penaltyAir = 10.0             # Penalty for leaving air in tanks

# 2. Products - Prices, Demand, Outsourcing Costs
#
# 'name': Product Name
# 'demand': Demand (L)
[products]
    [products.p1]
        name = "p1"
        demand = 1134

    [products.p2]
        name = "p2"
        demand = 3465
    
    [products.p3]
        name = "p3"
        demand = 3780

    [products.p4]
        name = "p4"
        demand = 4000

    [products.p5]
        name = "p5"
        demand = 10000
    
    [products.p6]
        name = "p6"
        demand = 10000

    [products.p7]
        name = "p7"
        demand = 4000

    [products.p8]
        name = "p8"
        demand = 6000

    [products.p9]
        name = "p9"
        demand = 10000

    [products.p10]
        name = "p10"
        demand = 7500

    [products.p11]
        name = "p11"
        demand = 8500

# 3. Initial Inventory - Vineyard/Reception
#
# 'ST0': Initial Stock at Time = 0
[initial_inventory]
    s1 = 100000
    s2 = 9137
    s3 = 400000
    s4 = 400000
    s5 = 600000
    s6 = 150000
    s7 = 70000
    s8 = 90000
    s9 = 80000
    s10 = 85000
    s11 = 85000

# 4. Upper Bounds for the Model
#
# It is used as:
# ProdFinal[s] =< ProdFinal_bounds[s]
# This is equivalent to adding an explicit constraint,
# but implemented as a variable bound, which is tighter and better for MIP performance.
[product_ub]
    p1 = 1134
    p2 = 3465
    p3 = 3780
    p4 = 4000
    p5 = 10000
    p6 = 10000
    p7 = 4000
    p8 = 6000
    p9 = 10000
    p10 = 7500
    p11 = 8500

# 5. Product Lines
#
# Each [lines.N] entry defines one production line.
#
# steps: ordered list of processing tasks for this line
#        Fa = alcoholic fermentation
#        Fl = lactic (malolactic) fermentation
#        Fr = cold stabilization / filtration
#        Alm = long-term storage
# ecobulk: (optional, default false)
#          true -> product is stored in ecobulk-type tanks (subject to A16/A17)
#          false -> no ecobulk constraint

[lines.1]
steps = ["Fa", "Fl", "Fr"]

[lines.2]
steps = ["Fa", "Fl", "Fr", "Alm"]
ecobulk = true

[lines.3]
steps = ["Fa", "Fl", "Fr", "Alm"]
ecobulk = true

[lines.4]
steps = ["Fa", "Fl", "Fr"]

[lines.5]
steps = ["Fa", "Fl", "Fr", "Alm"]
ecobulk = true

[lines.6]
steps = ["Fa", "Fl", "Fr"]

[lines.7]
steps = ["Fa", "Fr"]

[lines.8]
steps = ["Fa", "Fr"]

[lines.9]
steps = ["Fa", "Fr"]

[lines.10]
steps = ["Fa", "Fr"]

[lines.11]
steps = ["Fa", "Fl", "Fr"]

# 6. Tasks Templates
# 
# These rules apply to ALL lines
#
# Fermentation (Fa)
[templates.Fa]
    alpha = 144.0  # Duration
    beta = 0.0
    
    # Allowed Tanks and Limits [Bmin, Bmax]
    [templates.Fa.compatible_units]
        inox5000  = [500, 4000]
        inox10000 = [1000, 8000]
        inox17500 = [1750, 14000]
        inox22000 = [2200, 17600]

# Malolactic fermentation (Fl)
[templates.Fl]
    alpha = 504.0
    beta = 0.0
    
    # Allowed Tanks and Limits [Bmin, Bmax]
    [templates.Fl.compatible_units]
        inox22000  = [4400, 21560] 
        subte6300  = [1260, 6174]
        subte7500  = [1500, 7350]
        subte9000  = [1800, 8820]
        subte9500  = [1900, 9310]
        subte12700 = [2540, 12446]

# Cold stabilization (Fr)
[templates.Fr]
    alpha = 168.0
    beta = 0.0
    
    # Allowed Tanks and Limits [Bmin, Bmax]
    [templates.Fr.compatible_units]
        iso5000  = [1000, 5000]
        iso10000 = [2000, 10000]

# Storage (Alm)
[templates.Alm]
    beta = 0.0
    
    # Allowed Tanks and Limits [Bmin, Bmax]
    [templates.Alm.compatible_units]
        inox22000  = [20900, 22000]
        subte6300  = [5985, 6300]
        subte7500  = [7125, 7500]
        subte9000  = [8550, 9000]
        subte9500  = [9025, 9500]
        subte12700 = [12065, 12700]
        iso5000    = [4750, 5000]
        iso10000   = [9500, 10000]

# 7. State Consumption/Production Coefficients (rho)
# 
# These define how much of each state is consumed/produced per unit batch size
# for each task type. Applied to all lines (1-6) of each task type.
[rho.Fa1]
    rhoIScons = {s1 = -1.0}
    rhoISprod = {v1 = 0.7}

[rho.Fa2]
    rhoIScons = {s2 = -1.0}
    rhoISprod = {v2 = 0.7}

