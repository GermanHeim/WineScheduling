# Winery Scheduling Optimization Model Parameters
#
# This TOML file is adapted for the Makespan Minimization Model
#
# 1. Global Settings - Time and Penalties
[global]
    # The "Big M" Horizon (total available hours in the model)
    H = 3600  # 150 days

    # Number of event points
    n_max = 9

    # Activation/unit assignment limits
    iMax = 1
    jMax = 1
    jMin = 1
    iMaxST = 1
    jMaxST = 2
    jMinST = 1

    # =1 if the model forces wines using ecobulk to use some kind of tank for final storage
    # =0 if it is optimized
    MustUseEcobulk = 0

    # Technical penalty weights (for objective function tuning) based on time (h)
    penaltyMaxUtilization = 0.25  # Penalty for not utilizing tanks fully
    penaltyEmptyTank = 10.0       # Penalty for leaving tanks empty
    penaltyAir = 10.0             # Penalty for leaving air in tanks

# 2. Products - Prices, Demand, Outsourcing Costs
#
# 'name': Product Name
# 'category': Wine style (Red, White, Rose)
# 'demand': Demand (L)
[products]
    [products.Red1]
        name = "Cabernet Reserva"
        category = "Red"
        demand = 2000

    [products.White1]
        name = "Sauvignon Blanc"
        category = "White"
        demand = 3465

    [products.Rose1]
        name = "Rose de Verano"
        category = "Rose"
        demand = 3780

    [products.Red2]
        name = "Merlot Clasico"
        category = "Red"
        demand = 4000

    [products.White2]
        name = "Chardonnay Roble"
        category = "White"
        demand = 10000

    [products.Rose2]
        name = "Rose Andino"
        category = "Rose"
        demand = 10000

    [products.Red3]
        name = "Malbec Joven"
        category = "Red"
        demand = 4000

    [products.White3]
        name = "Semillon Fresco"
        category = "White"
        demand = 6000

    [products.Rose3]
        name = "Rose Patagonia"
        category = "Rose"
        demand = 10000

    [products.Red4]
        name = "Syrah de Altura"
        category = "Red"
        demand = 7500

    [products.White4]
        name = "Torrontes Aromatico"
        category = "White"
        demand = 8500

# 3. Initial Inventory - Vineyard/Reception
#
# 'ST0': Initial Stock at Time = 0
[initial_inventory]
    s_red = 655000
    s_white_rose = 2000000

# 4. Upper Bounds for the Model
#
# It is used as:
# ProdFinal[s] =< ProdFinal_bounds[s]
# This is equivalent to adding an explicit constraint,
# but implemented as a variable bound, which is tighter and better for MIP performance.
[product_ub]
    Red1 = 2000
    White1 = 3465
    Rose1 = 3780
    Red2 = 4000
    White2 = 10000
    Rose2 = 10000
    Red3 = 4000
    White3 = 6000
    Rose3 = 10000
    Red4 = 7500
    White4 = 8500

# 5. Product Lines
#
# Each [lines.N] entry defines one production line.
#
# steps: ordered list of processing tasks for this line
#        Pr = pressing (separates liquid from skins/seeds)
#        Fa = alcoholic fermentation
#        Fl = lactic (malolactic) fermentation
#        Cs = cold stabilization
#        Alm = long-term storage
# ecobulk: (optional, default false)
#          true -> product is stored in ecobulk-type tanks (subject to A16/A17)
#          false -> no ecobulk constraint
[lines.1]
product = "Red1"
steps = ["Fa", "Fl", "Cs"]

[lines.2]
product = "White1"
steps = ["Pr", "Fa", "Fl", "Cs", "Alm"]
ecobulk = true

[lines.3]
product = "Rose1"
steps = ["Pr", "Fa", "Fl", "Cs", "Alm"]
ecobulk = true

[lines.4]
product = "Red2"
steps = ["Fa", "Fl", "Cs"]

[lines.5]
product = "White2"
steps = ["Pr", "Fa", "Fl", "Cs", "Alm"]
ecobulk = true

[lines.6]
product = "Rose2"
steps = ["Pr", "Fa", "Fl", "Cs"]

[lines.7]
product = "Red3"
steps = ["Fa", "Fl", "Cs"]

[lines.8]
product = "White3"
steps = ["Pr", "Fa", "Cs"]

[lines.9]
product = "Rose3"
steps = ["Pr", "Fa", "Cs"]

[lines.10]
product = "Red4"
steps = ["Fa", "Fl", "Cs"]

[lines.11]
product = "White4"
steps = ["Pr", "Fa", "Fl", "Cs"]

# 6. Tasks Templates
#
# These rules apply to ALL lines
#
# Pressing (Pr)
[templates.Pr]
    alpha = 1.0
    beta = 0.004 # 1 h/250 L
    compatible_units = ["press"]

# Fermentation (Fa)
[templates.Fa]
    alpha = 240.0
    beta = 0.0
    compatible_units = ["inox5000", "inox10000", "inox17500", "inox22000"]

# Malolactic fermentation (Fl)
[templates.Fl]
    alpha = 720.0
    beta = 0.0
    compatible_units = ["inox22000", "subte6300", "subte7500", "subte9000", "subte9500", "subte12700"]

# Cold stabilization (Cs)
[templates.Cs]
    alpha = 168.0
    beta = 0.0
    compatible_units = ["iso5000", "iso10000"]

# Storage (Alm)
[templates.Alm]
    beta = 0.0
    compatible_units = ["inox22000", "subte6300", "subte7500", "subte9000", "subte9500", "subte12700", "iso5000", "iso10000"]

# 7. State Consumption/Production Coefficients (rho)
#
# These define how much of each state is consumed/produced per unit batch size
# for each task type.
