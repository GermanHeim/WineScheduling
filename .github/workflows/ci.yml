name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync

      - name: Test building models
        run: |
          uv run python -c "from WineSchedulingMS import create_wine_scheduling_model as create_ms; create_ms(); print('MS built successfully')"
          uv run python -c "from WineSchedulingMS_GDP import create_wine_scheduling_model as create_ms_gdp; create_ms_gdp(); print('MS GDP built successfully')"
          uv run python -c "from WineSchedulingEconomic_GDP import create_wine_scheduling_model as create_eco_gdp; create_eco_gdp(); print('Economic GDP built successfully')"
